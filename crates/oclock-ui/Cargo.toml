[package]
name = "oclock-ui"
version = "0.1.0"
edition = "2024"
description = "Desktop GUI for the oclock time tracker"
license = "GPL-3.0-or-later"

[[bin]]
name = "oclock-ui"

[dependencies]
oclock = { path = "../oclock", features = ["client", "api"] }
oclock-bridge = { path = "../oclock-bridge" }
oclock-idle = { path = "../oclock-idle" }
directories = "6"
chrono = "0.4"
iced = { version = "0.14", features = ["tokio", "canvas"] }
ksni = "0.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
